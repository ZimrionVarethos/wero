name: wero
description: "Wero — Activity tracking fitness app prototype."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.2.0
  flutter_markdown_plus: ^1.0.12
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Font files will be added here once Poppins TTF assets are available locally.
  # Until then, google_fonts package is used for runtime loading.
