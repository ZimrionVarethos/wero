name: wero
description: "Wero — Activity tracking fitness app prototype."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  shared_preferences: ^2.5.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.2.0
  flutter_markdown_plus: ^1.0.12
  geolocator: ^14.1.1
  url_launcher: ^6.3.1
  audioplayers: ^6.8.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - logodantulisan.png
    - logo.png
    - ornamen.png
    - icon.png
    - news_icon.png


